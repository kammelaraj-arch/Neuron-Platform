<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>SmartPlotter — upload</title>
<link rel="stylesheet" href="/static/smartplotter.css">
</head><body>
<header><h1>+ Upload image → profile</h1><nav><a href="/">← Back</a></nav></header>
<main>
  <form method="post" enctype="multipart/form-data">
    <label>Image <input name="file" type="file" accept="image/*" required></label><br>
    <label>Name <input name="name" placeholder="Jalebi spiral, Human form, Logo …"></label><br>
    <label>Feed (mm/s) <input name="feed_mm_s" type="number" value="30" step="1"></label><br>
    <label>Z lift (mm) <input name="z_lift_mm" type="number" value="2" step="0.5"></label><br>
    <label>Smoothing (1-10) <input name="smoothing" type="number" value="3" min="1" max="10"></label><br>
    <button>Extract contours → save profile</button>
  </form>
</main></body></html>
