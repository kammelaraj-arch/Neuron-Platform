<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sjweb — Upload</title>
  <link rel="stylesheet" href="/static/sjweb.css">
</head>
<body>
  <header>
    <h1>+ Upload image</h1>
    <nav><a href="/">← Back</a></nav>
  </header>
  <main>
    <form method="post" enctype="multipart/form-data">
      <label>Image file <input type="file" name="file" accept="image/*" required></label><br>
      <label>Profile name <input name="name" placeholder="e.g. Jalebi spiral, Human figure"></label><br>
      <label>Scale <input name="scale" value="1.0" type="number" step="0.1"></label><br>
      <label>Smoothing (1-10) <input name="smoothing" value="3" type="number" min="1" max="10"></label><br>
      <button>Upload + extract contours</button>
    </form>
  </main>
</body>
</html>
