# Stand-alone docker-compose for the Neuron Master Platform.
#
# Fully INDEPENDENT from any ShitalEco service:
#   - own image (neuron/master:0.3.0)
#   - own private volumes (neuron_data, neuron_artifacts) — never shared
#   - own bridge network (neuron_internal)
#   - own SQLite file; backend/db.py refuses to start if NEURON_DB_URL ever
#     contains 'shital' or 'shitaleco'
#
# Bound to the docker0 bridge IP (172.17.0.1) on port 8088 so the host's
# existing nginx can proxy to it via:
#     proxy_pass http://172.17.0.1:8088
# but the public internet cannot reach it directly. The same trick is
# already used elsewhere on this host for dev.shital.org.uk → :8080.
#
# Usage (from neuron-platform/master_platform):
#   docker compose up -d --build
# Or run ../deploy.sh which wraps this + reloads the shared nginx.
services:
  neuron-master:
    build:
      context: ..
      dockerfile: master_platform/Dockerfile
    image: neuron/master:0.3.0
    container_name: neuron-master
    restart: unless-stopped
    environment:
      NEURON_DB_URL: sqlite+aiosqlite:////app/master_platform/data/neuron.db
      NEURON_LIBRARIES_DIR: /app/libraries
      NEURON_SHARED_SCHEMAS_DIR: /app/shared_schemas
      NEURON_BUILD_ARTIFACTS_DIR: /app/master_platform/build_artifacts
      NEURON_BIND_HOST: 0.0.0.0
      NEURON_BIND_PORT: 8088
      NEURON_LOG_LEVEL: info
    ports:
      # Bind only on the docker bridge gateway so nginx can reach it but
      # the public internet cannot. Override to "8088:8088" for direct
      # access during local development.
      - "${NEURON_BIND_IP:-172.17.0.1}:8088:8088"
    volumes:
      - neuron_data:/app/master_platform/data
      - neuron_artifacts:/app/master_platform/build_artifacts
    networks:
      - neuron_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Neuron-only webhook deployer ───────────────────────────────────────────
  # Independent from ShitalEco's deployer — separate image, separate
  # secret, separate port. The shared nginx proxies
  # https://neuron.shital.org.uk/deploy → 172.17.0.1:8089.
  # On a webhook hit it runs /app/deploy.sh which only touches the
  # Neuron stack (this very compose file). It never restarts a ShitalEco
  # service.
  neuron-deployer:
    build:
      context: ../deployer
      dockerfile: Dockerfile
    image: neuron/deployer:0.3.0
    container_name: neuron-deployer
    restart: unless-stopped
    environment:
      NEURON_DEPLOY_SECRET: ${NEURON_DEPLOY_SECRET:?NEURON_DEPLOY_SECRET must be set}
      NEURON_DEPLOY_BRANCH: ${NEURON_DEPLOY_BRANCH:-claude/shital-erp-platform-iR2UF}
      NEURON_DEPLOYER_PORT: "9090"
    ports:
      # docker0 bridge gateway only — public internet cannot reach this.
      - "${NEURON_BIND_IP:-172.17.0.1}:8089:9090"
    volumes:
      # Bind-mount the host repo so the deployer can git pull + invoke
      # neuron-platform/deploy.sh. Path is configurable for hosts that
      # check the repo out somewhere other than /opt/shitaleco.
      - ${NEURON_REPO_PATH:-/opt/shitaleco}:/workspace
      # Docker socket so deploy.sh can `docker compose up -d` the Neuron
      # stack. The deployer uses the host's docker daemon — same as the
      # ShitalEco deployer does for its own stack.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - neuron_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neuron_data:
  neuron_artifacts:

networks:
  neuron_internal:
    driver: bridge
