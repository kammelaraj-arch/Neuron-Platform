# Stand-alone docker-compose for the Neuron Master Platform.
#
# Two services:
#   neuron-master    — the FastAPI app (Admin + Build + Config UI + API)
#   neuron-deployer  — webhook listener that re-runs deploy.sh on POST
#
# Both bind to the docker0 bridge gateway (172.17.0.1) so a host-level
# reverse proxy can reach them but the public internet cannot reach
# them directly. The reverse proxy is operator-managed infrastructure;
# this compose does not configure it.
#
# Usage (from the repo root):
#   docker compose -f master_platform/docker-compose.yml up -d --build
# Or run deploy.sh which wraps this.
services:
  neuron-master:
    build:
      context: ..
      dockerfile: master_platform/Dockerfile
    image: neuron/master:0.3.0
    container_name: ${NEURON_MASTER_CONTAINER:-neuron-master}
    restart: unless-stopped
    environment:
      NEURON_DB_URL: sqlite+aiosqlite:////app/master_platform/data/neuron.db
      NEURON_LIBRARIES_DIR: /app/libraries
      NEURON_SHARED_SCHEMAS_DIR: /app/shared_schemas
      NEURON_BUILD_ARTIFACTS_DIR: /app/master_platform/build_artifacts
      NEURON_BIND_HOST: 0.0.0.0
      NEURON_BIND_PORT: 8088
      NEURON_LOG_LEVEL: info
    ports:
      # Bind on the docker bridge gateway. During parallel-stack standup,
      # set NEURON_MASTER_BIND_PORT=8090 so the new stack runs alongside
      # the old container on :8088. At cutover, unset the override and
      # the new stack takes over :8088 itself.
      - "${NEURON_BIND_IP:-172.17.0.1}:${NEURON_MASTER_BIND_PORT:-8088}:8088"
    volumes:
      - neuron_data:/app/master_platform/data
      - neuron_artifacts:/app/master_platform/build_artifacts
    networks:
      - neuron_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Webhook-driven redeploy listener. The host's reverse proxy forwards
  # https://neuron.shital.org.uk/deploy → 172.17.0.1:8089 → this
  # container. POST with header `X-Deploy-Secret: $NEURON_DEPLOY_SECRET`
  # triggers a background run of deploy.sh.
  neuron-deployer:
    build:
      context: ../deployer
      dockerfile: Dockerfile
    image: neuron/deployer:0.3.0
    container_name: ${NEURON_DEPLOYER_CONTAINER:-neuron-deployer}
    restart: unless-stopped
    environment:
      NEURON_DEPLOY_SECRET: ${NEURON_DEPLOY_SECRET:?NEURON_DEPLOY_SECRET must be set}
      NEURON_DEPLOY_BRANCH: ${NEURON_DEPLOY_BRANCH:-main}
      NEURON_DEPLOYER_PORT: "9090"
    ports:
      # During parallel standup, set NEURON_DEPLOYER_BIND_PORT=8091 so the
      # new deployer runs alongside any existing :8089. At cutover, unset.
      - "${NEURON_BIND_IP:-172.17.0.1}:${NEURON_DEPLOYER_BIND_PORT:-8089}:9090"
    volumes:
      # Bind-mount the host repo so the deployer can git pull + invoke
      # deploy.sh. Default path is /opt/neuron-platform; override with
      # NEURON_REPO_PATH if your checkout lives elsewhere.
      - ${NEURON_REPO_PATH:-/opt/neuron-platform}:/workspace
      # Docker socket so deploy.sh can rebuild + restart the Neuron
      # stack via the host docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - neuron_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neuron_data:
  neuron_artifacts:

networks:
  neuron_internal:
    driver: bridge
