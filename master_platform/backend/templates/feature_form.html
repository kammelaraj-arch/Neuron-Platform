{% extends "base.html" %}
{% block title %}New feature request{% endblock %}
{% block content %}
  <header>
    <nav class="text-xs text-slate-500"><a href="/ui/features" class="hover:underline">Features</a> · new</nav>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight">New feature request</h1>
  </header>

  <form method="post" action="/ui/features/new" class="mt-6 grid gap-4 max-w-2xl">
    <div>
      <label class="block text-xs uppercase tracking-wider text-slate-400">Title</label>
      <input name="title" required maxlength="200"
             class="mt-1 w-full rounded-md border border-slate-700 bg-slate-900/60 px-3 py-2 text-sm" />
    </div>

    <div>
      <label class="block text-xs uppercase tracking-wider text-slate-400">Description</label>
      <textarea name="description" rows="6"
                class="mt-1 w-full rounded-md border border-slate-700 bg-slate-900/60 px-3 py-2 text-sm font-mono"
                placeholder="What does this feature do? Acceptance criteria, links, screenshots…"></textarea>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400">Requested by</label>
        <input name="requested_by" required value="{{ default_requested_by }}"
               class="mt-1 w-full rounded-md border border-slate-700 bg-slate-900/60 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400">Priority</label>
        <select name="priority"
                class="mt-1 w-full rounded-md border border-slate-700 bg-slate-900/60 px-3 py-2 text-sm">
          {% for p in PRIORITIES %}
            <option value="{{ p }}" {% if p == 'normal' %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="flex gap-3">
      <button class="rounded-md bg-emerald-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400">
        Create
      </button>
      <a href="/ui/features" class="rounded-md border border-slate-700 px-4 py-2 text-sm text-slate-300 hover:bg-slate-800">Cancel</a>
    </div>
  </form>
{% endblock %}
