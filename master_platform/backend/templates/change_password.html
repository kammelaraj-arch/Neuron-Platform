{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
  <div class="mx-auto mt-12 max-w-md">
    <div class="rounded-2xl border border-amber-700/40 bg-amber-500/[0.05] p-8 shadow-xl">
      <h1 class="text-xl font-semibold tracking-tight">🔐 Change your password</h1>
      <p class="mt-1 text-xs text-amber-200/80">
        Your account is flagged <code class="rounded bg-slate-800 px-1.5 py-0.5">must_change_password</code> — set a new one to continue.
      </p>
      {% if error %}
        <div class="mt-4 rounded-lg border border-red-700/40 bg-red-500/10 px-3 py-2 text-sm text-red-200">{{ error }}</div>
      {% endif %}
      <form method="post" action="/change-password" class="mt-6 space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-widest text-slate-400">Current password</label>
          <input type="password" name="current_password" autocomplete="current-password" required
            class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-emerald-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-slate-400">New password (min 8 chars)</label>
          <input type="password" name="new_password" autocomplete="new-password" minlength="8" required
            class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-emerald-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-slate-400">Confirm new password</label>
          <input type="password" name="new_password_confirm" autocomplete="new-password" minlength="8" required
            class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-emerald-400 focus:outline-none" />
        </div>
        <button class="w-full rounded-lg bg-emerald-500 px-4 py-2 font-medium text-slate-950 hover:bg-emerald-400 transition">Change password</button>
      </form>
    </div>
  </div>
{% endblock %}
