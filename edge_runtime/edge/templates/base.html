<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Neuron Edge{% endblock %} — {{ edge_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-30">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
        <span class="inline-flex h-7 w-7 items-center justify-center rounded-md bg-gradient-to-br from-cyan-400 to-emerald-500 text-slate-950 font-black">E</span>
        <div class="font-semibold tracking-tight">Neuron Edge</div>
        <div class="text-slate-500 text-sm">{{ edge_id }} · {{ site_id }}</div>
        <div class="ml-auto text-xs text-slate-500">deny-by-default · mTLS-ready</div>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
