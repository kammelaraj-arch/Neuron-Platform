# Edge MQTT broker config — local LAN only.
#
# This broker is used for Pico ↔ Edge realtime traffic. The Edge's
# Python services treat MQTT as the canonical bus; the existing
# REST endpoints (POST /api/v1/twin/{dna}/desired etc.) keep working
# as a shim for clients that don't speak MQTT.
#
# Security:
#   * `listener 1883 0.0.0.0`  — anonymous local-LAN only. Bound to
#     the docker network only; nginx never proxies MQTT to the
#     internet, and the Edge access-policy middleware denies all
#     non-LAN HTTP traffic anyway.
#   * For the open WAN path (Master → Edge), a separate TLS listener
#     can be added later (port 8883 + mTLS).
#
# Topic shape (see docs/mqtt_topics.md):
#   twin/<twin_kind>/<device_dna>/{desired,reported,current}/<field>
#   device/<device_dna>/heartbeat
#   alarm/<device_dna>/<alarm_id>

per_listener_settings true

listener 1883 0.0.0.0
allow_anonymous true
protocol mqtt

# Persist the in-flight queue across restarts so a heartbeat / desired-state
# update isn't lost during a redeploy.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Lightweight retention: each retained message stays until overwritten.
max_queued_messages 2000
max_inflight_messages 50
