# ─── Neuron Master Platform — host nginx vhost ──────────────────────────────
# Canonical source tracked in git. The watchdog at
# scripts/vhost-watchdog.sh keeps /opt/shitaleco/nginx/conf.d/neuron.conf
# in sync with this file (target → canonical, never the other way).
# Edits here flow through the next watchdog tick + an nginx reload.
#
# Key behaviours layered on the base vhost:
#   • proxy_next_upstream + retry: hides the brief gap during deploy
#     container recreates (typically 2-5s) by retrying on connection
#     refused / 502 / 504 instead of returning the error to the client.
#   • upstream{} block with `backup` server: the next backend in the
#     pool absorbs traffic when the primary is mid-restart. During
#     normal operation both point at the same container; during a
#     blue/green swap they diverge briefly.
#   • Aggressive but bounded connect_timeout: 2s on first attempt so a
#     failing backend doesn't stall every request for the full read
#     timeout.

upstream neuron_master_pool {
    # Primary: the live neuron-master container's docker-bridge binding.
    server 172.17.0.1:8088 max_fails=2 fail_timeout=3s;
    # Backup: the parallel-standup port (matches the
    # NEURON_MASTER_BIND_PORT=8090 override in deploy.sh). Marked
    # `backup` so nginx only sends traffic here when the primary is
    # marked down — i.e. during a blue/green deploy swap.
    server 172.17.0.1:8090 backup max_fails=2 fail_timeout=3s;
    keepalive 32;
}

# HTTP → HTTPS redirect (lets the existing certbot webroot keep renewing).
server {
    listen 80;
    server_name neuron.shital.org.uk;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://neuron.shital.org.uk$request_uri; }
}

# HTTPS proxy.
server {
    listen 443 ssl;
    http2 on;
    server_name neuron.shital.org.uk;

    ssl_certificate     /etc/letsencrypt/live/neuron.shital.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuron.shital.org.uk/privkey.pem;
    ssl_session_cache shared:NeuronSSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The deploy webhook listener — separate container, separate port.
    location = /deploy {
        proxy_pass         http://172.17.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        # Don't retry POST /deploy on errors — it must be exactly-once.
        proxy_next_upstream off;
    }

    # Everything else → master pool (with graceful failover).
    location / {
        proxy_pass         http://neuron_master_pool;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";   # enable keepalive to upstream

        # Hide the brief restart window (deploy.sh stop + start of
        # neuron-master typically 2-5s). On connection refused /
        # 502 / 504, retry the next backend in the pool up to 3 times
        # within 10 seconds total.
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout      2s;
        proxy_send_timeout         30s;
        proxy_read_timeout         60s;
    }
}
